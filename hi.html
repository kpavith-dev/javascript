<!----  color change using javaScript DOM(document object model ) Manipulation  

<style>
    div{
        background-color: black;
        width: 200px;
        height: 200px;
        }
</style>

    <div  id="box"></div>
    <button onclick="change()">change</button>
    <script>
        
        var box = document.getElementById("box")


        function change(){


            box.style.backgroundColor = "red"
            box.style.color = "black"
            box.style.fontSize = "30px"
            box.style.textAlign = "center"
            box.textContent = "HELLO WORLD"
        }
    </script>

<!--- add a new div with the text "HELLO WORLD" inside the <div id="result"> when the button is clicked.

<button onclick="update()">add</button>

<div id="result"></div>

<script>
    
    var  div = document.getElementById("result")


   function update(){

        var listitem = document.createElement("div")
        listitem.textContent ="HELLO WORLD"
        div.append(listitem)

<!--- change the text of the <h1> tag to the text of the button that is clicked.

<h1 id="h1">Name</h1>
    
<button onclick="change(event)">John</button> 
<button onclick="change(event)">Praveen</button>
<button onclick="change(event)">Jack</button> 


<script>

    var h1 = document.getElementById("h1")


    function change(event){

        h1.textContent = event.target.textContent



       
    }

</script>

<h1 id="four" onclick="deleteText(event)">Four</h1>
<h1 id="five" onclick="deleteText(event)">Five</h1>

    var h3 = document.getElementById("three")
    var h4 = document.getElementById("four")
    var h5 = document.getElementById("five")
    var h6 = document.getElementById("six")

       event.target.remove()
